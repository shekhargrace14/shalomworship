name: MongoDB Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb

      - name: Create Backup
        run: |
          mongodump \
            --uri="${{ secrets.MONGODB_URI }}" \
            --out=backup

      - name: Zip Backup
        run: |
          zip -r mongodb-backup.zip backup

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Configure R2 Credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Upload to Cloudflare R2
        run: |
          aws s3 cp mongodb-backup.zip \
            s3://${{ secrets.R2_BUCKET_NAME }}/mongodb-backup-$(date +%Y-%m-%d-%H-%M).zip \
            --endpoint-url=https://${{ secrets.R2_ENDPOINT }}

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup
          path: mongodb-backup.zip
