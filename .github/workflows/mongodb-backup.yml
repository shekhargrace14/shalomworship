name: MongoDB Backup
on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb

      - name: Create Backup
        run: |
          mongodump \
            --uri="${{ secrets.MONGODB_URI }}" \
            --out=backup

      - name: Zip Backup
        run: |
          zip -r mongodb-backup.zip backup

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp mongodb-backup.zip \
            s3://${{ secrets.R2_BUCKET_NAME }}/mongodb-backup-$(date +%Y-%m-%d-%H-%M).zip \
            --endpoint-url=${{ secrets.R2_ENDPOINT }}

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup
          path: mongodb-backup.zip